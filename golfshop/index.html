document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 --border: #e8e4d8;\n  --shadow-sm: 0 1px 3px rgba(26,60,52,0.06);\n  --shadow-md: 0 4px 16px rgba(26,60,52,0.08);\n  --shadow-lg: 0 8px 32px rgba(26,60,52,0.12);\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --font-display: 'Cormorant Garamond', Georgia, serif;\n  --font-body: 'Outfit', system-ui, -apple-system, sans-serif;\n  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);\n}\n\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: var(--font-body);\n  font-weight: 400;\n  color: var(--text-dark);\n  background: var(--white);\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n.container {\n  max-width: 1280px;\n  margin: 0 auto;\n  padding: 0 32px;\n}\n\na { color: inherit; text-decoration: none; }\nul { list-style: none; }\nimg { display: block; max-width: 100%; }\n\n/* ===== PLACEHOLDER IMAGES ===== */\n.placeholder-label, .placeholder-desc {\n  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n}\n.placeholder-label {\n  font-size: 10px;\n  opacity: 0.5;\n}\n.placeholder-desc {\n  font-size: 12px;\n  opacity: 0.7;\n  font-weight: 500;\n}\n\n/* ===== TOP BAR ===== */\n.top-bar {\n  background: var(--green-900);\n  color: var(--cream);\n  font-size: 13px;\n  letter-spacing: 0.01em;\n}\n.top-bar-inner {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  height: 40px;\n  gap: 16px;\n}\n.top-bar-left, .top-bar-right {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n}\n.top-contact {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  opacity: 0.9;\n  transition: opacity var(--transition);\n}\n.top-contact:hover { opacity: 1; }\n.top-divider {\n  width: 1px;\n  height: 14px;\n  background: rgba(254,250,224,0.2);\n}\n.top-schedule { opacity: 0.6; font-size: 12px; }\n.top-link {\n  opacity: 0.7;\n  font-size: 12.5px;\n  transition: opacity var(--transition);\n}\n.top-link:hover { opacity: 1; }\n\n\n/* ===== HEADER ===== */\n.header {\n  background: var(--white);\n  border-bottom: 1px solid var(--border);\n  position: sticky;\n  top: 0;\n  z-index: 100;\n}\n.header-inner {\n  display: flex;\n  align-items: center;\n  gap: 32px;\n  height: 72px;\n}\n.logo {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  flex-shrink: 0;\n}\n.logo-mark { flex-shrink: 0; }\n.logo-text { display: flex; align-items: baseline; }\n.logo-name {\n  font-family: var(--font-display);\n  font-size: 24px;\n  font-weight: 700;\n  color: var(--green-900);\n  letter-spacing: 0.04em;\n}\n.logo-domain {\n  font-family: var(--font-display);\n  font-size: 24px;\n  font-weight: 700;\n  color: var(--gold-500);\n}\n\n/* Search */\n.search-bar {\n  flex: 1;\n  max-width: 520px;\n  position: relative;\n}\n.search-input {\n  width: 100%;\n  height: 44px;\n  padding: 0 48px 0 20px;\n  border: 1.5px solid var(--border);\n  border-radius: 100px;\n  font-family: var(--font-body);\n  font-size: 14px;\n  color: var(--text-dark);\n  background: var(--cream-dark);\n  outline: none;\n  transition: all var(--transition);\n}\n.search-input::placeholder { color: var(--text-light); }\n.search-input:focus {\n  border-color: var(--green-700);\n  background: var(--white);\n  box-shadow: 0 0 0 3px rgba(45,106,79,0.1);\n}\n.search-btn {\n  position: absolute;\n  right: 4px;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 36px;\n  height: 36px;\n  border: none;\n  background: var(--green-700);\n  color: var(--cream);\n  border-radius: 50%;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: background var(--transition);\n}\n.search-btn:hover { background: var(--green-900); }\n\n/* Header Actions */\n.header-actions {\n  display: flex;\n  gap: 8px;\n  flex-shrink: 0;\n}\n.header-action {\n  width: 44px;\n  height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border-radius: te;\n  inset: 0;\n  overflow: hidden;\n}\n.cat-tile-pattern {\n  position: absolute;\n  inset: 0;\n}\n.cat-tile-img-placeholder {\n  position: absolute;\n  right: 20px;\n  bottom: 80px;\n  width: 180px;\n  height: 180px;\n  border-radius: var(--radius-md);\n  background: repeating-linear-gradient(\n    45deg,\n    transparent,\n    transparent 8px,\n    rgba(255,255,255,0.04) 8px,\n    rgba(255,255,255,0.04) 16px\n  );\n  border: 1.5px dashed rgba(255,255,255,0.2);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 4px;\n  color: rgba(255,255,255,0.5);\n}\n.cat-tile-img-placeholder.small {\n  width: 120px;\n  height: 120px;\n  right: 16px;\n  bottom: 70px;\n}\n.cat-tile--large .cat-tile-img-placeholder {\n  width: 240px;\n  height: 240px;\n  bottom: 100px;\n  right: 30px;\n}\n.cat-tile-content {\n  position: relative;\n  z-index: 2;\n  margin-top: auto;\n  padding: 24px;\n  background: linear-gradient(0deg, rgba(0,0,0,0.5) 0%, transparent 100%);\n  color: var(--cream);\n}\n.cat-tile-count {\n  font-size: 12px;\n  text-transform: uppercase;\n  letter-spacing: 0.08em;\n  opacity: 0.7;\n}\n.cat-tile-title {\n  font-family: var(--font-display);\n  font-size: 28px;\n  font-weight: 600;\n  margin-top: 4px;\n  line-height: 1.2;\n}\n.cat-tile--large .cat-tile-title { font-size: 36px; }\n.cat-tile-subs {\n  display: block;\n  margin-top: 6px;\n  font-size: 13px;\n  opacity: 0.7;\n}\n.cat-tile-arrow {\n  position: absolute;\n  top: 20px;\n  right: 20px;\n  width: 36px;\n  height: 36px;\n  background: rgba(254,250,224,0.15);\n  backdrop-filter: blur(8px);\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--cream);\n  font-size: 18px;\n  transition: all var(--transition);\n  z-index: 2;\n}\n.cat-tile:hover .cat-tile-arrow {\n  background: var(--gold-500);\n  color: var(--green-900);\n}\n\n/* ===== PRODUCTS SECTION ===== */\n.products-section {\n  padding: 64px 0;\n}\n.section-header {\n  display: flex;\n  align-items: flex-end;\n  justify-content: space-between;\n  margin-bottom: 36px;\n  gap: 24px;\n}\n.section-title {\n  font-family: var(--font-display);\n  font-size: 36px;\n  font-weight: 600;\n  color: var(--green-900);\n  line-height: 1.2;\n}\n.section-title.centered { text-align: center; }\n.section-sub {\n  font-size: 15px;\n  color: var(--text-light);\n  margin-top: 4px;\n}\n.section-link {\n  font-size: 14px;\n  font-weight: 500;\n  color: var(--green-700);\n  white-space: nowrap;\n  transition: color var(--transition);\n}\n.section-link:hover { color: var(--green-900); }\n\n.products-grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 24px;\n}\n\n/* Product Card */\n.product-card {\n  background: var(--white);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  overflow: hidden;\n  position: relative;\n  transition: all var(--transition);\n  display: flex;\n  flex-direction: column;\n}\n.product-card:hover {\n  border-color: var(--green-300);\n  box-shadow: var(--shadow-md);\n}\n.product-badges {\n  position: absolute;\n  top: 12px;\n  left: 12px;\n  display: flex;\n  gap: 6px;\n  z-index: 3;\n}\n.badge {\n  padding: 4px 10px;\n  border-radius: 100px;\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.02em;\n}\n.badge--hit { background: var(--green-700); color: var(--cream); }\n.badge--sale { background: #c0392b; color: white; }\n.badge--new { background: var(--gold-500); color: var(--green-900); }\n\n.product-image {\n  aspect-ratio: 1;\n  background: var(--cream-dark);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 24px;\n}\n.product-placeholder {\n  width: 100%;\n  height: 100%;\n  border-radius: var(--radius-md);\n  background: repeating-linear-gradient(\n    45deg,\n    transparent,\n    transparent 10px,\n    rgba(26,60,52,0.03) 10px,\n    rgba(26,60,52,0.03) 20px\n  );\n  border: 1.5px dashed var(--border);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 4px;\n  color: var(--text-light);\n}\n\n.product-info {\n  padding: 20px;\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n}\n.product-brand {\n  font-size: 11px;\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n  color: var(--text-light);\n  font-weight: 600;\n}\n.product-name {\n  font-family: var(--font-body);\n  font-size: 15px;\n  font-weight: 500;\n  color: var(--text-dark);\n  margin-top: 6px;\n  line-height: 1.4;\n  display: -webkit-box;\n  -webkit-line-clamp: 2;\n  -webkit-box-orient: vertical;\n  overflow: hidden;\n}\n.product-pricing {\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  margin-top: 12px;\n  margin-bottom: auto;\n}\n.product-price {\n  font-size: 20px;\n  font-weight: 700;\n  color: var(--green-900);\n  font-family: var(--font-display);\n}\n.product-price-old {\n  font-size: 14px;\n  color: var(--text-light);\n  text-decoration: line-through;\n}\n.product-btn {\n  display: block;\n  width: 100%;\n  margin-top: 16px;\n  padding: 12px;\n  border: 1.5px solid var(--green-700);\n  border-radius: var(--radius-sm);\n  background: transparent;\n  color: var(--green-700);\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.02em;\n  cursor: pointer;\n  transition: all var(--transition);\n}\n.product-btn:hover {\n  background: var(--green-700);\n  color: var(--cream);\n}\n\n/* ===== PROMO BANNER ===== */\n.promo-banner {\n  padding: 32px 0;\n}\n.promo-inner {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  background: var(--green-900);\n  border-radius: var(--radius-xl);\n  overflow: hidden;\n  min-height: 320px;\n}\n.promo-content {\n  padding: 56px 48px;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  gap: 16px;\n}\n.promo-label {\n  font-size: 12px;\n  text-transform: uppercase;\n  letter-spacing: 0.12em;\n  color: var(--gold-500);\n  font-weight: 600;\n}\n.promo-title {\n  font-family: var(--font-display);\n  font-size: 36px;\n  font-weight: 600;\n  color: var(--cream);\n  line-height: 1.2;\n}\n.promo-text {\n  font-size: 15px;\n  color: var(--green-200);\n  line-height: 1.6;\n  max-width: 400px;\n}\n.promo-btn {\n  display: inline-flex;\n  align-items: center;\n  padding: 14px 28px;\n  background: var(--gold-500);\n  color: var(--green-900);\n  border-radius: var(--radius-sm);\n  font-weight: 600;\n  font-size: 14px;\n  letter-spacing: 0.01em;\n  transition: all var(--transition);\n  align-self: flex-start;\n  margin-top: 8px;\n}\n.promo-btn:hover {\n  background: var(--gold-400);\n  transform: translateY(-1px);\n}\n.promo-visual {\n  position: relative;\n}\n.promo-placeholder {\n  position: absolute;\n  inset: 24px;\n  border-radius: var(--radius-md);\n  background: repeating-linear-gradient(\n    45deg,\n    transparent,\n    transparent 12px,\n    rgba(255,255,255,0.03) 12px,\n    rgba(255,255,255,0.03) 24px\n  );\n  border: 1.5px dashed rgba(255,255,255,0.15);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  color: rgba(255,255,255,0.4);\n}\n\n/* ===== BRANDS ===== */\n.brands-section {\n  padding: 64px 0;\n  background: var(--cream-dark);\n}\n.brands-section .section-title {\n  margin-bottom: 40px;\n}\n.brands-grid {\n  display: grid;\n  grid-template-columns: repeat(6, 1fr);\n  gap: 20px;\n}\n.brand-logo {\n  height: 80px;\n  background: var(--white);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: all var(--transition);\n}\n.brand-logo span {\n  font-family: var(--font-display);\n  font-size: 18px;\n  font-weight: 600;\n  color: var(--text-light);\n  letter-spacing: 0.03em;\n}\n.brand-logo:hover {\n  border-color: var(--green-300);\n  box-shadow: var(--shadow-sm);\n}\n.brand-logo:hover span {\n  color: var(--green-700);\n}\n\n/* ===== B
